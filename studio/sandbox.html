<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVO sandbox</title>
  <style>
    /* Reproduce BMP's CVO widget-container defaults so a CVO that *inherits*
       font / size / colour / background (the cvo-design-strategy convention)
       previews the way it will look in the portal. CVOs that set their own
       styles override these. */
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'LatoLatinWeb', 'Lato', system-ui, sans-serif;
      font-size: 12px;
      color: #343536;
      background: #fff;
    }
    #cvo-root { padding: 0 16px 16px; }
  </style>
  <script type="module" crossorigin src="./sandbox.js"></script>
</head>
<body>
</body>
</html>
