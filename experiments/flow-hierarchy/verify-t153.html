<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../../src/styles/tokens.css"/>
<link rel="stylesheet" href="../../src/styles/base.css"/>
<link rel="stylesheet" href="../../src/sidepanel/sidepanel.css"/>
<style>
  body{margin:0;background:var(--surface-0);padding:20px;}
  .pane{width:380px;background:var(--surface-1);border:1px solid var(--surface-3);border-radius:6px;overflow:hidden;}
  h1{color:var(--text-2);font:600 13px/1.2 Inter;margin:0 0 12px;}
</style>
</head>
<body>
<h1>t.153 — ButtonInput action graph + ButtonGroup outline (real CSS)</h1>
<div class="pane" id="pane"></div>
<script>
  const ph=(d,s)=>`<svg width="${s||12}" height="${s||12}" viewBox="0 0 256 256" fill="currentColor"><path d="${d}"/></svg>`;
  const I={
    key:ph('M196,76a16,16,0,1,1-16-16A16,16,0,0,1,196,76Zm48,22.74A84.3,84.3,0,0,1,160.11,180H160a83.52,83.52,0,0,1-23.65-3.38l-7.86,7.87A12,12,0,0,1,120,188H108v12a12,12,0,0,1-12,12H84v12a12,12,0,0,1-12,12H40a20,20,0,0,1-20-20V187.31a19.86,19.86,0,0,1,5.86-14.14l53.52-53.52A84,84,0,1,1,244,98.74ZM202.43,53.57A59.48,59.48,0,0,0,158,36c-32,1-58,27.89-58,59.89a59.69,59.69,0,0,0,4.2,22.19,12,12,0,0,1-2.55,13.21L44,189v23H60V200a12,12,0,0,1,12-12H84V176a12,12,0,0,1,12-12h19l9.65-9.65a12,12,0,0,1,13.22-2.55A59.58,59.58,0,0,0,160,156h.08c32,0,58.87-26.07,59.89-58A59.55,59.55,0,0,0,202.43,53.57Z'),
    lightning:ph('M219.71,117.38a12,12,0,0,0-7.25-8.52L161.28,88.39l10.59-70.61a12,12,0,0,0-20.64-10l-112,120a12,12,0,0,0,4.31,19.33l51.18,20.47L84.13,238.22a12,12,0,0,0,20.64,10l112-120A12,12,0,0,0,219.71,117.38ZM113.6,203.55l6.27-41.77a12,12,0,0,0-7.41-12.92L68.74,131.37,142.4,52.45l-6.27,41.77a12,12,0,0,0,7.41,12.92l43.72,17.49Z'),
    code:ph('M71.68,97.22,34.74,128l36.94,30.78a12,12,0,1,1-15.36,18.44l-48-40a12,12,0,0,1,0-18.44l48-40A12,12,0,0,1,71.68,97.22Zm176,21.56-48-40a12,12,0,1,0-15.36,18.44L221.26,128l-36.94,30.78a12,12,0,1,0,15.36,18.44l48-40a12,12,0,0,0,0-18.44ZM164.1,28.72a12,12,0,0,0-15.38,7.18l-64,176a12,12,0,0,0,7.18,15.37A11.79,11.79,0,0,0,96,228a12,12,0,0,0,11.28-7.9l64-176A12,12,0,0,0,164.1,28.72Z'),
  };
  const ABBR={InputView:'INV',InputSet:'INS',ButtonInput:'BTN',ButtonGroup:'BGP',NotificationTransportGroup:'NTG',ExtendedTransport:'XTR',ChangePropertyTransport:'CPT',ActivateFormsTransport:'AFT',SmtpTransport:'SMT',RunReportTransport:'RRT',SoapTransport:'SOP',FileTransport:'FIL',AddObjectTransport:'ADD'};
  const COLOR={InputView:'#1f8bff',InputSet:'#4589ff',ButtonInput:'#0f62fe',ButtonGroup:'#8a8c93',NotificationTransportGroup:'#a56eff',ExtendedTransport:'#9b7bff',ChangePropertyTransport:'#9b7bff',ActivateFormsTransport:'#777',SmtpTransport:'#777',RunReportTransport:'#777',SoapTransport:'#777',FileTransport:'#777',AddObjectTransport:'#777'};
  const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
  const txt=(t,c,s)=>{const e=el(t,c);e.textContent=s;return e;};
  const pill=(ty,out)=>{const p=txt('span','flow-pill'+(out?' flow-pill--out':''),ABBR[ty]||ty.slice(0,3).toUpperCase());p.style.setProperty('--tc',COLOR[ty]||'#777');return p;};
  const navHead=(cls,ty,name)=>{const h=el('div',cls+' flow-nav');h.append(pill(ty),txt('span','flow-name',name));return h;};
  function codeField(prop,first){
    const wrap=el('div','flow-cf');
    const head=el('div','flow-line flow-cf-head');
    const ic=el('span','flow-ic flow-ic--code');ic.innerHTML=(prop==='expression'?I.code:I.lightning);head.append(ic);
    const tx=el('span','flow-cf-tx mono');tx.append(txt('span','flow-cf-prop',prop),txt('span','flow-cf-lines',' · 1 line'));head.append(tx);
    const b=el('button','btn btn-small btn-ghost flow-cf-edit');b.textContent='Edit ↗';head.append(b);
    wrap.append(head);
    const sub=el('div','flow-cf-sub');sub.append(txt('div','flow-cf-prev mono',first));wrap.append(sub);
    return wrap;
  }
  // leaf card (optionally with nested children)
  function card(ty,name,fields,children){
    const c=el('div','flow-card');c.append(navHead('flow-card-head',ty,name));
    if(fields){const bd=el('div','flow-fields');fields.forEach(f=>bd.append(codeField(f[0],f[1])));c.append(bd);}
    if(children&&children.length){const sub=el('div','flow-subcards');children.forEach(ch=>sub.append(ch));c.append(sub);}
    return c;
  }
  function groupBox(name,buttons){
    const box=el('div','flow-groupbox');
    box.append(txt('div','flow-grouplabel','group · '+name));
    buttons.forEach(b=>box.append(b));
    return box;
  }

  const transports=[
    card('ActivateFormsTransport','Activate form'),
    card('SmtpTransport','Send e-mail'),
    card('RunReportTransport','Run report'),
    card('SoapTransport','Run web service'),
    card('FileTransport','Save file on shared host'),
    card('AddObjectTransport','Add object'),
    card('ChangePropertyTransport','Update object property',[['value','"Pending approval"']]),
    card('ExtendedTransport','Extended action',[['expression','recipient := t.case.owner.email']]),
  ];
  const ntg=card('NotificationTransportGroup','Action group',null,transports);
  const actionBtn=card('ButtonInput','Button',null,[ntg]);
  const group=groupBox('Button group',[card('ButtonInput','Button',[['expression','t.x := 1']]),card('ButtonInput','Button')]);

  const pane=document.getElementById('pane');
  const head=el('div','flow-section-head');head.append(txt('span','flow-section-label','Flow'),txt('span','flow-section-meta','13 steps · 3 with EC'));
  const chain=el('div','flow-chain');
  const root=el('div','flow-root');
  root.append(navHead('flow-root-head','InputView','Input view'));
  const grp=el('div','flow-group');grp.append(pill('InputSet',true),txt('span','flow-group-name','Input set'));root.append(grp);
  root.append(actionBtn,group);
  chain.append(root);
  pane.append(head,chain);
</script>
</body>
</html>
