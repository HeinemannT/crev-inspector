<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Flow walker — verify against real extension CSS</title>
<!-- The ACTUAL extension stylesheets, so this renders exactly what ships. -->
<link rel="stylesheet" href="../../src/styles/tokens.css"/>
<link rel="stylesheet" href="../../src/styles/base.css"/>
<link rel="stylesheet" href="../../src/sidepanel/sidepanel.css"/>
<style>
  body{margin:0;background:var(--surface-0);padding:20px;}
  .pane{width:380px;background:var(--surface-1);border:1px solid var(--surface-3);border-radius:6px;overflow:hidden;}
  h1{color:var(--text-2);font:600 13px/1.2 var(--font-body, Inter);margin:0 0 12px;}
  .ec-tok-tx{color:var(--ec-tx);} /* ensure preview tokens resolve */
</style>
</head>
<body>
  <h1>Rendered with the real sidepanel.css (.flow-* rules) — not preview CSS</h1>
  <div class="pane" id="pane"></div>

<script>
  // Real Phosphor paths (match src/lib/icons.ts).
  const ph=(d,s)=>`<svg width="${s||12}" height="${s||12}" viewBox="0 0 256 256" fill="currentColor"><path d="${d}"/></svg>`;
  const I={
    key:ph('M196,76a16,16,0,1,1-16-16A16,16,0,0,1,196,76Zm48,22.74A84.3,84.3,0,0,1,160.11,180H160a83.52,83.52,0,0,1-23.65-3.38l-7.86,7.87A12,12,0,0,1,120,188H108v12a12,12,0,0,1-12,12H84v12a12,12,0,0,1-12,12H40a20,20,0,0,1-20-20V187.31a19.86,19.86,0,0,1,5.86-14.14l53.52-53.52A84,84,0,1,1,244,98.74ZM202.43,53.57A59.48,59.48,0,0,0,158,36c-32,1-58,27.89-58,59.89a59.69,59.69,0,0,0,4.2,22.19,12,12,0,0,1-2.55,13.21L44,189v23H60V200a12,12,0,0,1,12-12H84V176a12,12,0,0,1,12-12h19l9.65-9.65a12,12,0,0,1,13.22-2.55A59.58,59.58,0,0,0,160,156h.08c32,0,58.87-26.07,59.89-58A59.55,59.55,0,0,0,202.43,53.57Z'),
    lightning:ph('M219.71,117.38a12,12,0,0,0-7.25-8.52L161.28,88.39l10.59-70.61a12,12,0,0,0-20.64-10l-112,120a12,12,0,0,0,4.31,19.33l51.18,20.47L84.13,238.22a12,12,0,0,0,20.64,10l112-120A12,12,0,0,0,219.71,117.38ZM113.6,203.55l6.27-41.77a12,12,0,0,0-7.41-12.92L68.74,131.37,142.4,52.45l-6.27,41.77a12,12,0,0,0,7.41,12.92l43.72,17.49Z'),
    arrowIn:ph('M132,136v64a12,12,0,0,1-24,0V165L48.49,224.49a12,12,0,0,1-17-17L91,148H56a12,12,0,0,1,0-24h64A12,12,0,0,1,132,136ZM208,28H80A20,20,0,0,0,60,48V92a12,12,0,0,0,24,0V52H204V172H164a12,12,0,0,0,0,24h44a20,20,0,0,0,20-20V48A20,20,0,0,0,208,28Z'),
    arrowOut:ph('M228,104a12,12,0,0,1-24,0V69l-59.51,59.51a12,12,0,0,1-17-17L187,52H152a12,12,0,0,1,0-24h64a12,12,0,0,1,12,12Zm-44,24a12,12,0,0,0-12,12v64H52V84h64a12,12,0,0,0,0-24H48A20,20,0,0,0,28,80V208a20,20,0,0,0,20,20H176a20,20,0,0,0,20-20V140A12,12,0,0,0,184,128Z'),
    eyeSlash:ph('M56.88,31.93A12,12,0,1,0,39.12,48.07l16,17.65C20.67,88.66,5.72,121.58,5,123.13a12.08,12.08,0,0,0,0,9.75c.37.82,9.13,20.26,28.49,39.61C59.37,198.34,92,212,128,212a131.34,131.34,0,0,0,51-10l20.09,22.1a12,12,0,0,0,17.76-16.14ZM128,188c-29.59,0-55.47-10.73-76.91-31.88A130.69,130.69,0,0,1,29.52,128c5.27-9.31,18.79-29.9,42-44.29l90.09,99.11A109.33,109.33,0,0,1,128,188Zm123-55.12c-.36.81-9,20-28,39.16a12,12,0,1,1-17-16.9A130.48,130.48,0,0,0,226.48,128a130.36,130.36,0,0,0-21.57-28.12C183.46,78.73,157.59,68,128,68c-3.35,0-6.7.14-10,.42a12,12,0,1,1-2-23.91c3.93-.34,8-.51,12-.51,36,0,68.63,13.67,94.49,39.52,19.35,19.35,28.11,38.8,28.48,39.61A12.08,12.08,0,0,1,251,132.88Z'),
    subsSlash:ph('M48,128a12,12,0,0,1,12-12H76a12,12,0,0,1,0,24H60A12,12,0,0,1,48,128Zm168.88,79.93a12,12,0,1,1-17.76,16.14l-11-12.07H32a20,20,0,0,1-20-20V64A20,20,0,0,1,32,44h4.68a12,12,0,0,1,20.2-12.07ZM166.33,188l-10.91-12H60a12,12,0,0,1,0-24h73.6l-10.91-12H116a12,12,0,0,1-10.1-18.47L57.24,68H36V188ZM224,44H116.6a12,12,0,0,0,0,24H220V182.94a12,12,0,0,0,24,0V64A20,20,0,0,0,224,44Zm-28,96a12,12,0,0,0,0-24H182.06a12,12,0,0,0,0,24Z'),
    codeBlock:ph('M51.51,104.49l-32-32a12,12,0,0,1,0-17l32-32a12,12,0,1,1,17,17L45,64,68.49,87.51a12,12,0,0,1-17,17Zm48,0a12,12,0,0,0,17,0l32-32a12,12,0,0,0,0-17l-32-32a12,12,0,1,0-17,17L123,64,99.51,87.51A12,12,0,0,0,99.51,104.49ZM200,36H180a12,12,0,0,0,0,24h16V196H60V140a12,12,0,0,0-24,0v60a20,20,0,0,0,20,20H200a20,20,0,0,0,20-20V56A20,20,0,0,0,200,36Z'),
  };
  const PROP={expression:I.lightning,initExpression:I.arrowIn,afterExpression:I.arrowOut,showExpression:I.eyeSlash,enableExpression:I.subsSlash,defaultExpression:I.codeBlock};
  const ABBR={InputView:'INV',InputSet:'INS',Label:'LBL',NumberInput:'NIN',ChoiceInput:'CIN',ButtonInput:'BTN',ActionButton:'ACB',NotificationTransportGroup:'NTG',ExtendedTransport:'XTR'};
  const COLOR={InputView:'#1f8bff',InputSet:'#4589ff',Label:'#bca37a',NumberInput:'#78a9ff',ChoiceInput:'#78a9ff',ButtonInput:'#0f62fe',ActionButton:'#0f62fe',NotificationTransportGroup:'#a56eff',ExtendedTransport:'#9b7bff'};
  const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
  const txt=(t,c,s)=>{const e=el(t,c);e.textContent=s;return e;};
  const ic=(svg,cls)=>{const s=el('span','flow-ic '+cls);s.innerHTML=svg;return s;};
  const pill=(ty,out)=>{const p=txt('span','flow-pill'+(out?' flow-pill--out':''),ABBR[ty]||ty.slice(0,3).toUpperCase());p.style.setProperty('--tc',COLOR[ty]||'#777');return p;};

  function codeField(cf){
    const wrap=el('div','flow-cf'+(cf.off?' flow-cf--off':''));
    const head=el('div','flow-line flow-cf-head');
    head.append(ic(PROP[cf.prop]||I.lightning,'flow-ic--code'));
    const tx=el('span','flow-cf-tx mono');tx.append(txt('span','flow-cf-prop',cf.prop),txt('span','flow-cf-lines',' · '+cf.lineCount+(cf.lineCount===1?' line':' lines')));
    head.append(tx);
    const b=el('button','btn btn-small btn-ghost flow-cf-edit');b.textContent='Edit ↗';head.append(b);
    wrap.append(head);
    const sub=el('div','flow-cf-sub');
    sub.append(txt('div','flow-cf-prev mono',cf.firstLine));
    if(cf.off)sub.append(txt('div','flow-cf-gate','Off: '+cf.gateProp+' = false'));
    if(cf.reads){const r=el('div','flow-cf-reads');r.append(txt('span','flow-cf-reads-label','reads '));cf.reads.forEach(k=>r.append(txt('span','flow-reads-chip',k)));sub.append(r);}
    wrap.append(sub);
    return wrap;
  }
  function fields(node){
    const codes=node.codeFields||[];if(!node.inputKey&&!codes.length)return null;
    const b=el('div','flow-fields');
    if(node.inputKey){const k=el('div','flow-line flow-keyline');k.append(ic(I.key,'flow-ic--key'),txt('span','flow-key-val mono',node.inputKey));b.append(k);}
    codes.forEach(cf=>b.append(codeField(cf)));
    return b;
  }
  function navHead(cls,node){const h=el('div',cls+' flow-nav');h.append(pill(node.type),txt('span','flow-name',node.name));return h;}

  function renderFlow(flow){
    const root=el('div','flow-root');
    root.append(navHead('flow-root-head',flow.root));
    const rb=fields(flow.root);if(rb)root.append(rb);
    if(flow.container){const g=el('div','flow-group');g.append(pill(flow.container.type,true),txt('span','flow-group-name',flow.container.name));root.append(g);}
    (flow.leaves||[]).forEach(lf=>{const c=el('div','flow-card');c.append(navHead('flow-card-head',lf));const b=fields(lf);if(b)c.append(b);root.append(c);});
    return root;
  }

  const inputView={root:{type:'InputView',name:'Risk Assessment Input'},container:{type:'InputSet',name:'Assessment Fields'},leaves:[
    {type:'Label',name:'Section: Inherent Risk',codeFields:[{prop:'defaultExpression',lineCount:1,firstLine:'"Inherent risk — before controls"'}]},
    {type:'NumberInput',name:'Likelihood',inputKey:'likelihood',codeFields:[
      {prop:'showExpression',lineCount:4,firstLine:'t.assessment.phase = "scoping"',off:true,gateProp:'useShowExpression',reads:['phase']},
      {prop:'afterExpression',lineCount:6,firstLine:'t.assessment.recalcBand()',reads:['likelihood']}]},
    {type:'NumberInput',name:'Impact',inputKey:'impact'},
    {type:'ButtonInput',name:'Save & Score — a deliberately very long input name to test truncation',inputKey:'save',codeFields:[
      {prop:'afterExpression',lineCount:12,firstLine:'t.risk.score := likelihood * impact + adjustmentFactorThatIsLong',reads:['likelihood','impact']}]},
  ]};
  const actionBtn={root:{type:'ActionButton',name:'Submit for Approval',codeFields:[
      {prop:'expression',lineCount:3,firstLine:'t.case.workflow.start("approval")'},
      {prop:'initExpression',lineCount:2,firstLine:'t.case.submittedBy := user()'},
      {prop:'showExpression',lineCount:1,firstLine:'t.case.status = "Draft"',off:true,gateProp:'useShowExpression'}]},
    container:{type:'NotificationTransportGroup',name:'Approval Notifications'},leaves:[
    {type:'ExtendedTransport',name:'Email Risk Owner',codeFields:[{prop:'expression',lineCount:8,firstLine:'recipient := t.case.owner.email',reads:['case.owner.email']}]},
    {type:'ExtendedTransport',name:'Update Workflow Status',codeFields:[{prop:'expression',lineCount:4,firstLine:'t.case.status := "Pending approval"'}]},
  ]};

  const pane=document.getElementById('pane');
  const chain=el('div','flow-chain');
  chain.append(renderFlow(inputView),renderFlow(actionBtn));
  const head=el('div','flow-section-head');head.append(txt('span','flow-section-label','Flow'),txt('span','flow-section-meta','7 steps · 5 with EC'));
  pane.append(head,chain);
</script>
</body>
</html>
