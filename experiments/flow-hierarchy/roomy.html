<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Flow hierarchy — roomy cards (icon-led)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --surface-0:#0f1014; --surface-1:#17181d; --surface-2:#1f2128; --surface-3:#2b2e38; --surface-4:#3a3e4a;
    --text-1:#e6e6ea; --text-2:#b2b4bb; --text-3:#8a8c93;
    --accent:#8b5cf6; --accent-bright:#a78bfa; --warning:#f9e2af; --ec-bg:#1e1e2e;
    --text-2xs:10px; --text-xs:11px; --text-sm:12px; --text-base:13px; --text-lg:15px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface-0);color:var(--text-1);font:var(--text-base)/1.5 var(--font-body);padding:26px;-webkit-font-smoothing:antialiased;}
  h1{font:600 var(--text-lg)/1.2 var(--font-body);margin:0 0 4px;}
  .sub-h{color:var(--text-2);font-size:var(--text-sm);margin:0 0 20px;max-width:680px;}
  .col{width:348px;}
  svg{display:block;}

  .title{font:600 var(--text-base)/1.3 var(--font-body);color:var(--text-1);}
  .body {font:var(--text-sm)/1.4 var(--font-body);color:var(--text-2);}
  .label{font:600 var(--text-2xs)/1.5 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
  .mono {font:var(--text-xs)/1.45 var(--font-mono);color:var(--text-2);}

  .frame{background:var(--surface-1);border:1px solid var(--surface-3);border-radius:8px;padding:11px;}
  .frame+.frame{margin-top:13px;}
  .pill{flex:none;font:600 var(--text-2xs)/1 var(--font-body);color:#fff;background:var(--tc,#777);padding:3px 5px;border-radius:3px;letter-spacing:.03em;}
  .pill.out{background:transparent;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 50%,transparent);}

  .fh{display:flex;align-items:center;gap:8px;}
  .fh .ct{margin-left:auto;}
  .grp{display:flex;align-items:center;gap:7px;margin:10px 1px;}

  .card{background:var(--surface-2);border:1px solid var(--surface-3);border-radius:6px;padding:8px 10px;}
  .card+.card{margin-top:7px;}
  .card .ch{cursor:pointer;display:flex;align-items:center;gap:8px;}
  .card:hover{border-color:var(--surface-4);}
  .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .bd{margin-top:8px;}
  /* every primary line is icon-led: a leading icon, then content. No gutter labels. */
  .line{display:flex;align-items:baseline;gap:6px;}
  .line+.line,.cf+.cf,.cf{margin-top:7px;}
  .line .ic{flex:none;align-self:flex-start;margin-top:1px;}
  .line .tx{flex:1;min-width:0;}
  .ic.key{color:var(--text-3);} .ic.code{color:var(--accent-bright);}
  .tx.code .pn{color:var(--accent-bright);font-weight:500;}
  .tx.code .ln{color:var(--text-3);}
  /* sub-items of a code field align under the prop name (past the icon) */
  .sub{padding-left:18px;}
  .when{display:flex;align-items:baseline;gap:5px;color:var(--warning);margin-top:4px;}
  .when svg{flex:none;align-self:flex-start;margin-top:1px;}
  .prev{margin-top:4px;background:var(--ec-bg);border:1px solid var(--surface-3);border-radius:4px;
    padding:4px 8px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reads{margin-top:4px;color:var(--text-3);}
</style>
</head>
<body>
  <h1>Flow hierarchy — roomy cards</h1>
  <p class="sub-h">Icon-led: each line leads with its icon (key · code · when), content aligned right after — no redundant "Code"/"Key" labels (the prop name and key icon already say it). The preview tucks just under the prop, not floating in a gutter.</p>

  <div class="col" id="root"></div>

<script>
  const ABBR={InputView:'INV',InputSet:'INS',Label:'LBL',NumberInput:'NIN',ChoiceInput:'CIN',ButtonInput:'BTN',ActionButton:'ACB',NotificationTransportGroup:'NTG',ExtendedTransport:'XTR'};
  const COLOR={InputView:'#1f8bff',InputSet:'#4589ff',Label:'#bca37a',NumberInput:'#78a9ff',ChoiceInput:'#78a9ff',ButtonInput:'#0f62fe',ActionButton:'#0f62fe',NotificationTransportGroup:'#a56eff',ExtendedTransport:'#9b7bff'};
  const ph=(d,s)=>`<svg width="${s||12}" height="${s||12}" viewBox="0 0 256 256" fill="currentColor"><path d="${d}"/></svg>`;
  const ICON_CODE=ph('M71.68,97.22,34.74,128l36.94,30.78a12,12,0,1,1-15.36,18.44l-48-40a12,12,0,0,1,0-18.44l48-40A12,12,0,0,1,71.68,97.22Zm176,21.56-48-40a12,12,0,1,0-15.36,18.44L221.26,128l-36.94,30.78a12,12,0,1,0,15.36,18.44l48-40a12,12,0,0,0,0-18.44ZM164.1,28.72a12,12,0,0,0-15.38,7.18l-64,176a12,12,0,0,0,7.18,15.37A11.79,11.79,0,0,0,96,228a12,12,0,0,0,11.28-7.9l64-176A12,12,0,0,0,164.1,28.72Z',12);
  const ICON_WHEN=ph('M236,64a36,36,0,1,0-48,33.94V112a4,4,0,0,1-4,4H96a27.8,27.8,0,0,0-4,.29V97.94a36,36,0,1,0-24,0v60.12a36,36,0,1,0,24,0V144a4,4,0,0,1,4-4h88a28,28,0,0,0,28-28V97.94A36.07,36.07,0,0,0,236,64ZM80,52A12,12,0,1,1,68,64,12,12,0,0,1,80,52Zm0,152a12,12,0,1,1,12-12A12,12,0,0,1,80,204ZM200,76a12,12,0,1,1,12-12A12,12,0,0,1,200,76Z',11);
  const ICON_KEY=ph('M196,76a16,16,0,1,1-16-16A16,16,0,0,1,196,76Zm48,22.74A84.3,84.3,0,0,1,160.11,180H160a83.52,83.52,0,0,1-23.65-3.38l-7.86,7.87A12,12,0,0,1,120,188H108v12a12,12,0,0,1-12,12H84v12a12,12,0,0,1-12,12H40a20,20,0,0,1-20-20V187.31a19.86,19.86,0,0,1,5.86-14.14l53.52-53.52A84,84,0,1,1,244,98.74ZM202.43,53.57A59.48,59.48,0,0,0,158,36c-32,1-58,27.89-58,59.89a59.69,59.69,0,0,0,4.2,22.19,12,12,0,0,1-2.55,13.21L44,189v23H60V200a12,12,0,0,1,12-12H84V176a12,12,0,0,1,12-12h19l9.65-9.65a12,12,0,0,1,13.22-2.55A59.58,59.58,0,0,0,160,156h.08c32,0,58.87-26.07,59.89-58A59.55,59.55,0,0,0,202.43,53.57Z',11);
  const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
  const txt=(t,c,s)=>{const e=el(t,c);e.textContent=s;return e;};
  const pill=(ty,cls)=>{const p=txt('span','pill'+(cls?' '+cls:''),ABBR[ty]||ty.slice(0,3).toUpperCase());p.style.setProperty('--tc',COLOR[ty]||'#777');return p;};
  const icon=(svgStr,cls)=>{const s=el('span','ic'+(cls?' '+cls:''));s.innerHTML=svgStr;return s;};

  const inputView={summary:'5 fields · 3 with logic',step:{identity:{type:'InputView',name:'Risk Assessment Input'},
    children:[{identity:{type:'InputSet',name:'Assessment Fields'},edgeLabel:'inputSet',children:[
      {identity:{type:'Label',name:'Section: Inherent Risk'},codeFields:[{prop:'defaultExpression',lineCount:1,firstLine:'"Inherent risk — before controls"'}]},
      {identity:{type:'NumberInput',name:'Likelihood'},inputKey:'likelihood',codeFields:[
        {prop:'showExpression',lineCount:4,gate:'phase = "scoping"',reads:['phase'],firstLine:'t.assessment.phase = "scoping"'},
        {prop:'afterExpression',lineCount:6,reads:['likelihood'],firstLine:'t.assessment.recalcBand()'}]},
      {identity:{type:'NumberInput',name:'Impact'},inputKey:'impact'},
      {identity:{type:'ChoiceInput',name:'Risk Category'},inputKey:'category'},
      {identity:{type:'ButtonInput',name:'Save & Score'},inputKey:'save',codeFields:[
        {prop:'enableExpression',lineCount:2,gate:'likelihood > 0 AND impact > 0',firstLine:'likelihood.whenMissing(0) > 0'},
        {prop:'afterExpression',lineCount:12,reads:['likelihood','impact'],firstLine:'t.risk.score := likelihood * impact'}]},
    ]}]}};
  const actionBtn={summary:'action · 4 with logic',step:{identity:{type:'ActionButton',name:'Submit for Approval'},codeFields:[
      {prop:'expression',lineCount:3,firstLine:'t.case.workflow.start("approval")'},
      {prop:'initExpression',lineCount:2,firstLine:'t.case.submittedBy := user()'},
      {prop:'showExpression',lineCount:1,gate:'status = "Draft"',firstLine:'t.case.status = "Draft"'}],
    children:[{identity:{type:'NotificationTransportGroup',name:'Approval Notifications'},edgeLabel:'actionObject',children:[
      {identity:{type:'ExtendedTransport',name:'Email Risk Owner'},codeFields:[{prop:'expression',lineCount:8,reads:['case.owner.email'],firstLine:'recipient := t.case.owner.email'}]},
      {identity:{type:'ExtendedTransport',name:'Update Workflow Status'},codeFields:[{prop:'expression',lineCount:4,firstLine:'t.case.status := "Pending approval"'}]},
    ]}]}};

  function spine(step){const chain=[step];let c=step;while(c.children&&c.children.length===1){c=c.children[0];chain.push(c);}return {root:chain[0],container:chain.length>1?chain[chain.length-1]:null,leaves:c.children||[]};}

  function codeField(cf){
    const wrap=el('div','cf');
    const head=el('div','line');head.appendChild(icon(ICON_CODE,'code'));
    const tx=el('span','tx mono code');tx.append(txt('span','pn',cf.prop),txt('span','ln',' · '+cf.lineCount+(cf.lineCount===1?' line':' lines')));
    head.appendChild(tx);wrap.appendChild(head);
    const sub=el('div','sub');
    if(cf.gate){const w=el('div','when mono');w.innerHTML=ICON_WHEN;w.append(txt('span',null,'when '+cf.gate));sub.appendChild(w);}
    if(cf.firstLine)sub.appendChild(txt('div','prev mono',cf.firstLine+' …'));
    if(cf.reads&&cf.reads.length)sub.appendChild(txt('div','reads mono','reads '+cf.reads.join(', ')));
    if(sub.children.length)wrap.appendChild(sub);
    return wrap;
  }
  function bodyFor(node){
    const codes=node.codeFields||[];if(!node.inputKey&&!codes.length)return null;
    const b=el('div','bd');
    if(node.inputKey){const k=el('div','line');k.appendChild(icon(ICON_KEY,'key'));k.appendChild(txt('span','tx mono',node.inputKey));b.appendChild(k);}
    codes.forEach(cf=>b.appendChild(codeField(cf)));
    return b;
  }

  function render(flow){
    const fr=el('div','frame');const {root,container,leaves}=spine(flow.step);
    const fh=el('div','fh');fh.append(pill(root.identity.type),txt('span','title',root.identity.name),txt('span','ct label',flow.summary));fr.appendChild(fh);
    const rb=bodyFor(root);if(rb)fr.appendChild(rb);
    if(container){const g=el('div','grp');g.append(pill(container.identity.type,'out'),txt('span','body',container.identity.name));fr.appendChild(g);}
    leaves.forEach(leaf=>{const card=el('div','card');const ch=el('div','ch');ch.title='Click to copy business id';ch.append(pill(leaf.identity.type),txt('span','title cn',leaf.identity.name));card.appendChild(ch);const lb=bodyFor(leaf);if(lb)card.appendChild(lb);fr.appendChild(card);});
    return fr;
  }
  document.getElementById('root').append(render(inputView),render(actionBtn));
</script>
</body>
</html>
